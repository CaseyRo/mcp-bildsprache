[project]
name = "mcp-bildsprache"
version = "0.3.53"
description = "MCP server for brand-aware image generation with OpenAI gpt-image and Gemini"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Casey Romkes" }]
dependencies = [
    "fastmcp>=4.0.10,<5.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.14.2",
    "pillow>=13.0.0",  # GHSA: 37 advisories, all fixed only in 13.0.0
    "piexif>=1.1.3",
    "python-slugify>=8.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    # Security floors (transitive deps of fastmcp; pinned to address CVEs)
    "authlib>=1.7.0",            # GHSA: CSRF in token cache handling
    "python-multipart>=0.0.32",  # GHSA: DoS via unbounded multipart headers
]

[project.scripts]
mcp-bildsprache = "mcp_bildsprache.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_bildsprache"]

[tool.hatch.build.targets.wheel.force-include]
"mcp_bildsprache/_shared/ai_attribution.schema.json" = "mcp_bildsprache/_shared/ai_attribution.schema.json"
"mcp_bildsprache/_shared/provider_costs.v1.yaml" = "mcp_bildsprache/_shared/provider_costs.v1.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
]

[tool.ruff]
# _shared/ mirrors CaseyRo/CDiT-marketingskills/shared/ byte-for-byte (drift is
# checked in the monthly CDiT OS update); lint it upstream, not here.
extend-exclude = ["mcp_bildsprache/_shared"]

[tool.ruff.lint]
# Pinned explicitly (CDI-1783) rather than inheriting ruff's defaults, which
# widen between releases. A linter's rule set should be a decision.
# BLE001 (blind `except Exception`) stays unselected: the defensive catches
# around provider calls and the detached render are deliberate.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = [
    # UP042 wants StrEnum, which changes str() of enum values on the wire
    # ("X.member" -> "member"). Fleet decision: no.
    "UP042",
]
