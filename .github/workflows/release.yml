name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'tests/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7

      - name: Install and test
        run: |
          uv sync
          uv run pytest -x
        env:
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"

      - name: Security audit (pip-audit)
        run: uvx pip-audit

      # Tag-only release: nothing is committed or pushed to the branch (protected
      # branches reject it). The version is the git tag; pyproject stays static.
      - name: Tag release
        id: version
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')")
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          git tag "v${NEXT}"
          git push origin "v${NEXT}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Set image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
