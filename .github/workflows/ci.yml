name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Does NOT gate the Komodo auto-deploy until branch protection makes `test` a
# required check. See openspec/changes/upgrade-fleet-fastmcp-4/AUDIT-2026-09-27.md
# in CDiT-infrastructure (Phase 0).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
