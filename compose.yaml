services:
  mcp-bildsprache:
    build: .
    restart: unless-stopped
    ports:
      - "8007:8000"
    labels:
      # Docktail exposes the container on the Tailnet at
      # https://bildsprache.<tailnet>.ts.net/. The gallery sub-app is
      # additionally gated by TailnetOnlyMiddleware via
      # GALLERY_TAILNET_HOSTNAME (defense in depth: docktail constrains
      # the network path, the middleware constrains the application).
      # DOCKTAIL_NETWORK is the compose project's default network
      # (<project>_default).
      docktail.service.enable: "true"
      docktail.service.name: "bildsprache"
      docktail.service.port: "8000"
      docktail.service.network: "${DOCKTAIL_NETWORK:-mcp-bildsprache_default}"
      docktail.service.service-protocol: "https"
      docktail.service.service-port: "443"
    environment:
      - TRANSPORT=http
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-}
      - MCP_BILDSPRACHE_API_KEY=${MCP_BILDSPRACHE_API_KEY:-}
      - MCP_BILDSPRACHE_PUBLIC_URL=${MCP_BILDSPRACHE_PUBLIC_URL:-}
      # Required when KEYCLOAK_CLIENT_SECRET is set (the server refuses to
      # start otherwise), e.g. https://auth.example.com/realms/<realm>.
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-mcp-bildsprache}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-mcp-bildsprache}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      # Cloudflare Access (Managed OAuth): accept the team-signed
      # Cf-Access-Jwt-Assertion so Access-gated clients auth without a bmcp_ key.
      # Both empty = disabled. Team domain looks like <team>.cloudflareaccess.com.
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - ENABLE_HOSTING=${ENABLE_HOSTING:-false}
      - IMAGE_DOMAIN=${IMAGE_DOMAIN:-https://img.cdit-works.de}
      - FASTMCP_HOME=/data/fastmcp
      - GALLERY_ENABLED=${GALLERY_ENABLED:-true}
      # Tailnet hostname for the gallery sub-app. Must match the docktail
      # service name above + your tailnet (bildsprache.<tailnet>.ts.net).
      - GALLERY_TAILNET_HOSTNAME=${GALLERY_TAILNET_HOSTNAME:-bildsprache.example.ts.net}
      - GALLERY_REINDEX_INTERVAL_SECONDS=${GALLERY_REINDEX_INTERVAL_SECONDS:-300}
      - GALLERY_SOFT_ZIP_CAP_MB=${GALLERY_SOFT_ZIP_CAP_MB:-250}
      - IDENTITY_ENABLED=${IDENTITY_ENABLED:-true}
      - IDENTITY_DIR=${IDENTITY_DIR:-/data/identity}
    volumes:
      - fastmcp-data:/data/fastmcp
      - images-data:/data/images
      - identity-data:/data/identity:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fastmcp-data:
  images-data:
  identity-data:
